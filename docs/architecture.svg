<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1180" viewBox="0 0 1800 1180" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#141a33"/></linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7c3aed"/><stop offset="1" stop-color="#4f46e5"/></linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0ea5e9"/><stop offset="1" stop-color="#14b8a6"/></linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#16a34a"/><stop offset="1" stop-color="#22c55e"/></linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f59e0b"/><stop offset="1" stop-color="#f97316"/></linearGradient>
    <linearGradient id="rose" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e11d48"/><stop offset="1" stop-color="#f43f5e"/></linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1c2340"/><stop offset="1" stop-color="#151b33"/></linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#94a3b8"/></marker>
    <marker id="arrowV" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a78bfa"/></marker>
    <marker id="arrowT" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5eead4"/></marker>
  </defs>

  <rect width="1800" height="1180" fill="url(#bg)"/>
  <circle cx="1500" cy="120" r="260" fill="#4f46e5" opacity="0.08"/>
  <circle cx="220" cy="1050" r="220" fill="#14b8a6" opacity="0.07"/>

  <!-- Title -->
  <text x="60" y="68" font-size="34" font-weight="700" fill="#f8fafc">Recall &#8212; System Architecture</text>
  <text x="60" y="100" font-size="16" fill="#94a3b8">Collaborative spaced-repetition flashcards &#183; React 19 &#183; Express 5 &#183; MongoDB Atlas &#183; single-origin deployment on Render (Docker)</text>

  <!-- ================= CLIENT COLUMN ================= -->
  <rect x="60" y="150" width="380" height="560" rx="22" fill="url(#panel)" stroke="#2a3357"/>
  <rect x="60" y="150" width="380" height="8" rx="4" fill="url(#violet)"/>
  <text x="86" y="196" font-size="20" font-weight="700" fill="#f1f5f9">Browser &#183; React 19 SPA</text>
  <text x="86" y="220" font-size="13" fill="#94a3b8">Served as static files from the same origin</text>

  <rect x="86" y="242" width="328" height="64" rx="14" fill="#0f1530" stroke="#3b3f6b"/>
  <text x="104" y="268" font-size="15" font-weight="600" fill="#e2e8f0">pages/</text>
  <text x="104" y="290" font-size="12.5" fill="#94a3b8">Library &#183; Folder &#183; Study &#183; Account &#183; Public</text>

  <rect x="86" y="318" width="328" height="64" rx="14" fill="#0f1530" stroke="#3b3f6b"/>
  <text x="104" y="344" font-size="15" font-weight="600" fill="#e2e8f0">components/</text>
  <text x="104" y="366" font-size="12.5" fill="#94a3b8">CardEditor &#183; ShareModal &#183; Radix primitives &#183; ui.jsx</text>

  <rect x="86" y="394" width="328" height="64" rx="14" fill="#0f1530" stroke="#3b3f6b"/>
  <text x="104" y="420" font-size="15" font-weight="600" fill="#e2e8f0">hooks/useApp</text>
  <text x="104" y="442" font-size="12.5" fill="#94a3b8">Session context &#183; useLoad &#183; 15 s folder polling</text>

  <rect x="86" y="470" width="328" height="64" rx="14" fill="#0f1530" stroke="#3b3f6b"/>
  <text x="104" y="496" font-size="15" font-weight="600" fill="#e2e8f0">services/api.js</text>
  <text x="104" y="518" font-size="12.5" fill="#94a3b8">fetch + credentials &#183; isolated demoApi adapter</text>

  <rect x="86" y="552" width="328" height="130" rx="14" fill="#1a1440" stroke="#5b4bd6"/>
  <text x="104" y="580" font-size="14" font-weight="700" fill="#c4b5fd">CLIENT-SIDE CONCURRENCY</text>
  <text x="104" y="604" font-size="12.5" fill="#cbd5e1">&#8226; Sends card/folder <tspan font-weight="700">version</tspan> with every edit</text>
  <text x="104" y="626" font-size="12.5" fill="#cbd5e1">&#8226; Review = { cardId, rating, <tspan font-weight="700">requestId</tspan>, version }</text>
  <text x="104" y="648" font-size="12.5" fill="#cbd5e1">&#8226; 409 VERSION_CONFLICT keeps the local draft</text>
  <text x="104" y="670" font-size="12.5" fill="#cbd5e1">&#8226; Drafts in sessionStorage per tab &#183; card &#183; user</text>

  <!-- External monitor -->
  <rect x="60" y="740" width="380" height="120" rx="22" fill="url(#panel)" stroke="#2a3357"/>
  <rect x="60" y="740" width="380" height="8" rx="4" fill="url(#amber)"/>
  <text x="86" y="782" font-size="18" font-weight="700" fill="#f1f5f9">External Monitor / Scheduler</text>
  <text x="86" y="806" font-size="12.5" fill="#94a3b8">UptimeRobot &#183; cron &#183; systemd &#183; GitHub Actions</text>
  <text x="86" y="828" font-size="12.5" fill="#fbbf24">scripts/healthcheck.js &#8594; GET /api/health every 5 min</text>
  <text x="86" y="848" font-size="11.5" fill="#94a3b8">Independent machine; never self-ping from the server</text>

  <!-- ================= SERVER COLUMN ================= -->
  <rect x="520" y="150" width="760" height="710" rx="22" fill="url(#panel)" stroke="#2a3357"/>
  <rect x="520" y="150" width="760" height="8" rx="4" fill="url(#teal)"/>
  <text x="546" y="196" font-size="20" font-weight="700" fill="#f1f5f9">Render Web Service &#183; Docker &#183; Node 22 &#183; Express 5</text>
  <text x="546" y="220" font-size="13" fill="#94a3b8">One process serves  /  (dist/index.html + assets)  and  /api/*</text>

  <!-- Edge middleware -->
  <rect x="546" y="240" width="708" height="86" rx="14" fill="#0f1530" stroke="#3b3f6b"/>
  <text x="564" y="266" font-size="15" font-weight="700" fill="#7dd3fc">EDGE MIDDLEWARE  (app.js)</text>
  <text x="564" y="290" font-size="12.5" fill="#cbd5e1">helmet CSP &#183; CORS allow-list &#183; rate limit 300/min per IP &#183; Cache-Control: no-store</text>
  <text x="564" y="311" font-size="12.5" fill="#cbd5e1">Origin / Sec-Fetch-Site CSRF guard on writes &#183; trust proxy=1 &#183; JSON body &#8804; 256 kB</text>

  <!-- Health routes (mounted before session) -->
  <rect x="546" y="338" width="340" height="56" rx="14" fill="#122a2a" stroke="#14b8a6"/>
  <text x="564" y="362" font-size="14" font-weight="700" fill="#5eead4">routes/health.js  (no session, no DB)</text>
  <text x="564" y="383" font-size="12" fill="#cbd5e1">GET /api/health 200 &#183; GET /api/ready 200 | 503</text>

  <rect x="914" y="338" width="340" height="56" rx="14" fill="#0f1530" stroke="#3b3f6b"/>
  <text x="932" y="362" font-size="14" font-weight="700" fill="#e2e8f0">middleware/auth.js</text>
  <text x="932" y="383" font-size="12" fill="#cbd5e1">optionalAuth: sha256(cookie) &#8594; Session &#8594; req.user</text>

  <!-- MVC layers -->
  <rect x="546" y="410" width="708" height="60" rx="14" fill="#0f1530" stroke="#3b3f6b"/>
  <text x="564" y="434" font-size="15" font-weight="700" fill="#e2e8f0">ROUTES  <tspan font-weight="400" fill="#94a3b8" font-size="13">routes/index.js</tspan></text>
  <text x="564" y="456" font-size="12.5" fill="#cbd5e1">Endpoint map &#183; zod validate() &#183; requireAuth &#183; per-route rate limits &#183; multer (5 MB, memory)</text>

  <rect x="546" y="482" width="708" height="60" rx="14" fill="#0f1530" stroke="#3b3f6b"/>
  <text x="564" y="506" font-size="15" font-weight="700" fill="#e2e8f0">CONTROLLERS  <tspan font-weight="400" fill="#94a3b8" font-size="13">auth &#183; folder &#183; card &#183; study &#183; health</tspan></text>
  <text x="564" y="528" font-size="12.5" fill="#cbd5e1">HTTP in / JSON out &#183; bcrypt(12) &#183; sharp decode&#8594;resize&#8594;WebP&#8594;strip metadata &#183; asyncHandler &#8594; error middleware</text>

  <rect x="546" y="554" width="708" height="112" rx="14" fill="#141a3a" stroke="#6366f1"/>
  <text x="564" y="578" font-size="15" font-weight="700" fill="#a5b4fc">SERVICES  <tspan font-weight="400" fill="#94a3b8" font-size="13">business rules &#183; transactions &#183; authorization</tspan></text>
  <text x="564" y="602" font-size="12.5" fill="#cbd5e1"><tspan font-weight="700" fill="#e0e7ff">accessService</tspan>  roleOf() owner &#8250; editor &#8250; viewer &#183; accessFolder() &#183; <tspan font-weight="700" fill="#fde68a">mutateFolder()</tspan> = transaction + ACL re-check + writeEpoch++</text>
  <text x="564" y="624" font-size="12.5" fill="#cbd5e1"><tspan font-weight="700" fill="#e0e7ff">folderService</tspan>  update &#183; members &#183; copy (deep-copies media) &#183; presentFolder hides private member lists</text>
  <text x="564" y="646" font-size="12.5" fill="#cbd5e1"><tspan font-weight="700" fill="#e0e7ff">cardService</tspan>  version check &#8594; Revision snapshot &#8594; save   <tspan font-weight="700" fill="#e0e7ff">studyService</tspan>  SM-2-style schedule() &#183; idempotent reviewCard()</text>

  <rect x="546" y="678" width="708" height="60" rx="14" fill="#0f1530" stroke="#3b3f6b"/>
  <text x="564" y="702" font-size="15" font-weight="700" fill="#e2e8f0">MODELS  <tspan font-weight="400" fill="#94a3b8" font-size="13">Mongoose schemas &#183; indexes &#183; toJSON transform</tspan></text>
  <text x="564" y="724" font-size="12.5" fill="#cbd5e1">select:false on passwordHash / email / media.data &#183; TTL on sessions &#183; unique indexes are the source of truth</text>

  <!-- Extension port -->
  <rect x="546" y="752" width="708" height="90" rx="14" fill="#0f1530" stroke="#3b3f6b" stroke-dasharray="6 5"/>
  <text x="564" y="778" font-size="15" font-weight="700" fill="#94a3b8">EXTENSION PORT  <tspan font-weight="400" font-size="13">extensions/knowledgeProvider.js &#183; disabled in v1</tspan></text>
  <text x="564" y="802" font-size="12.5" fill="#94a3b8">DomainEvent outbox is committed in the same transaction as each write &#8594; a future indexer reads events,</text>
  <text x="564" y="824" font-size="12.5" fill="#94a3b8">fetches authoritative cards, embeds them. Retrieval must re-check folder access; vectors are never an ACL.</text>

  <!-- ================= DATABASE COLUMN ================= -->
  <rect x="1360" y="150" width="380" height="710" rx="22" fill="url(#panel)" stroke="#2a3357"/>
  <rect x="1360" y="150" width="380" height="8" rx="4" fill="url(#green)"/>
  <text x="1386" y="196" font-size="20" font-weight="700" fill="#f1f5f9">MongoDB Atlas</text>
  <text x="1386" y="220" font-size="13" fill="#94a3b8">Replica set &#8594; multi-document transactions</text>

  <g font-size="12.5">
    <rect x="1386" y="242" width="328" height="50" rx="12" fill="#0f1530" stroke="#3b3f6b"/>
    <text x="1402" y="263" font-weight="700" fill="#e2e8f0">users</text>
    <text x="1402" y="282" fill="#94a3b8">unique username + email (lowercased)</text>

    <rect x="1386" y="300" width="328" height="50" rx="12" fill="#0f1530" stroke="#3b3f6b"/>
    <text x="1402" y="321" font-weight="700" fill="#e2e8f0">sessions</text>
    <text x="1402" y="340" fill="#94a3b8">tokenHash unique &#183; TTL index expires: 0</text>

    <rect x="1386" y="358" width="328" height="66" rx="12" fill="#1b2a1f" stroke="#22c55e"/>
    <text x="1402" y="379" font-weight="700" fill="#bbf7d0">folders  &#8592; ACL + coordination point</text>
    <text x="1402" y="398" fill="#cbd5e1">owner &#183; members[{user, role}] &#183; visibility</text>
    <text x="1402" y="416" fill="#cbd5e1">version (optimistic) &#183; writeEpoch (serializer)</text>

    <rect x="1386" y="432" width="328" height="50" rx="12" fill="#0f1530" stroke="#3b3f6b"/>
    <text x="1402" y="453" font-weight="700" fill="#e2e8f0">cards</text>
    <text x="1402" y="472" fill="#94a3b8">front/back {text, image} &#183; tags &#183; version</text>

    <rect x="1386" y="490" width="328" height="50" rx="12" fill="#0f1530" stroke="#3b3f6b"/>
    <text x="1402" y="511" font-weight="700" fill="#e2e8f0">media</text>
    <text x="1402" y="530" fill="#94a3b8">WebP Buffer (select:false) &#183; folder-scoped</text>

    <rect x="1386" y="548" width="328" height="50" rx="12" fill="#0f1530" stroke="#3b3f6b"/>
    <text x="1402" y="569" font-weight="700" fill="#e2e8f0">progress</text>
    <text x="1402" y="588" fill="#94a3b8">unique (user, card) &#183; interval &#183; ease &#183; dueAt &#183; version</text>

    <rect x="1386" y="606" width="328" height="50" rx="12" fill="#0f1530" stroke="#3b3f6b"/>
    <text x="1402" y="627" font-weight="700" fill="#e2e8f0">reviews</text>
    <text x="1402" y="646" fill="#94a3b8">unique (user, requestId) &#8594; idempotency ledger</text>

    <rect x="1386" y="664" width="328" height="50" rx="12" fill="#0f1530" stroke="#3b3f6b"/>
    <text x="1402" y="685" font-weight="700" fill="#e2e8f0">revisions &#183; activity</text>
    <text x="1402" y="704" fill="#94a3b8">unique (card, version) snapshots &#183; folder feed</text>

    <rect x="1386" y="722" width="328" height="50" rx="12" fill="#0f1530" stroke="#3b3f6b" stroke-dasharray="6 5"/>
    <text x="1402" y="743" font-weight="700" fill="#e2e8f0">domainevents</text>
    <text x="1402" y="762" fill="#94a3b8">transactional outbox &#183; processedAt index</text>
  </g>
  <text x="1386" y="812" font-size="12" fill="#94a3b8">Network access: Render has no static egress IP,</text>
  <text x="1386" y="830" font-size="12" fill="#94a3b8">so Atlas allows 0.0.0.0/0 + SCRAM credentials.</text>

  <!-- ================= ARROWS ================= -->
  <!-- Browser -> Express -->
  <path d="M440 300 H520" stroke="#a78bfa" stroke-width="2.5" fill="none" marker-end="url(#arrowV)"/>
  <text x="446" y="288" font-size="11.5" fill="#c4b5fd">HTTPS &#183; same origin</text>
  <path d="M440 500 H520" stroke="#a78bfa" stroke-width="2.5" fill="none" marker-end="url(#arrowV)"/>
  <text x="446" y="488" font-size="11.5" fill="#c4b5fd">/api &#183; cookie</text>
  <!-- Monitor -> health -->
  <path d="M440 800 H500 V366 H546" stroke="#fbbf24" stroke-width="2.5" fill="none" marker-end="url(#arrow)" stroke-dasharray="7 5"/>
  <!-- Express -> Mongo -->
  <path d="M1280 610 H1360" stroke="#5eead4" stroke-width="2.5" fill="none" marker-end="url(#arrowT)"/>
  <text x="1284" y="598" font-size="11.5" fill="#5eead4">Mongoose &#183; TLS</text>
  <path d="M1280 366 H1360" stroke="#5eead4" stroke-width="2" fill="none" marker-end="url(#arrowT)" stroke-dasharray="7 5"/>
  <text x="1286" y="354" font-size="11.5" fill="#5eead4">ping &#8804; 2 s</text>

  <!-- ================= REQUEST LIFECYCLE STRIP ================= -->
  <rect x="60" y="890" width="1680" height="250" rx="22" fill="url(#panel)" stroke="#2a3357"/>
  <rect x="60" y="890" width="1680" height="8" rx="4" fill="url(#rose)"/>
  <text x="86" y="934" font-size="20" font-weight="700" fill="#f1f5f9">Concurrency model &#8212; every folder-scoped write goes through <tspan fill="#fde68a">mutateFolder()</tspan></text>

  <g font-size="13">
    <rect x="86" y="960" width="300" height="150" rx="14" fill="#0f1530" stroke="#3b3f6b"/>
    <text x="104" y="988" font-weight="700" fill="#fca5a5">1 &#183; Transaction</text>
    <text x="104" y="1012" fill="#cbd5e1">mongoose.connection.transaction()</text>
    <text x="104" y="1034" fill="#cbd5e1">All reads + writes share one session;</text>
    <text x="104" y="1056" fill="#cbd5e1">card + revision + activity + outbox</text>
    <text x="104" y="1078" fill="#cbd5e1">commit or roll back together.</text>

    <rect x="404" y="960" width="320" height="150" rx="14" fill="#0f1530" stroke="#3b3f6b"/>
    <text x="422" y="988" font-weight="700" fill="#fca5a5">2 &#183; ACL re-check + writeEpoch++</text>
    <text x="422" y="1012" fill="#cbd5e1">accessFolder() inside the txn, then</text>
    <text x="422" y="1034" fill="#cbd5e1">$inc folder.writeEpoch. Two concurrent</text>
    <text x="422" y="1056" fill="#cbd5e1">writers touch the same doc &#8594; one aborts</text>
    <text x="422" y="1078" fill="#cbd5e1">(WriteConflict). Revocation can't race an edit.</text>

    <rect x="742" y="960" width="320" height="150" rx="14" fill="#0f1530" stroke="#3b3f6b"/>
    <text x="760" y="988" font-weight="700" fill="#fca5a5">3 &#183; Optimistic versioning</text>
    <text x="760" y="1012" fill="#cbd5e1">Client sends version it last saw.</text>
    <text x="760" y="1034" fill="#cbd5e1">Mismatch &#8594; 409 VERSION_CONFLICT,</text>
    <text x="760" y="1056" fill="#cbd5e1">nothing overwritten, draft preserved.</text>
    <text x="760" y="1078" fill="#cbd5e1">Folders, cards and progress all versioned.</text>

    <rect x="1080" y="960" width="320" height="150" rx="14" fill="#0f1530" stroke="#3b3f6b"/>
    <text x="1098" y="988" font-weight="700" fill="#fca5a5">4 &#183; Idempotency</text>
    <text x="1098" y="1012" fill="#cbd5e1">Review carries a client UUID requestId.</text>
    <text x="1098" y="1034" fill="#cbd5e1">Retry &#8594; same stored result returned.</text>
    <text x="1098" y="1056" fill="#cbd5e1">Same key, different payload &#8594; 409.</text>
    <text x="1098" y="1078" fill="#cbd5e1">Unique (user, requestId) backs it.</text>

    <rect x="1418" y="960" width="296" height="150" rx="14" fill="#0f1530" stroke="#3b3f6b"/>
    <text x="1436" y="988" font-weight="700" fill="#fca5a5">5 &#183; Constraints in the DB</text>
    <text x="1436" y="1012" fill="#cbd5e1">No check-then-insert. Unique</text>
    <text x="1436" y="1034" fill="#cbd5e1">indexes decide; E11000 &#8594; 409.</text>
    <text x="1436" y="1056" fill="#cbd5e1">usernames &#183; emails &#183; (user,card)</text>
    <text x="1436" y="1078" fill="#cbd5e1">progress &#183; (card,version) revisions</text>
  </g>
</svg>
