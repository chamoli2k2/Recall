# Render Blueprint for the native Node runtime, which compiles the code and snapshots the
# filesystem rather than building a Docker image and pushing it to Render's internal registry.
# The Dockerfile is still the way this runs everywhere else; this exists so the service can be
# deployed when that registry is unreachable.
#
# This file does nothing to an existing service. It only takes effect when a Blueprint is created
# from the repository.
services:
  - type: web
    name: remio
    runtime: node
    region: oregon
    # Change this if the service is on a paid tier; a Blueprint overwrites whatever is set.
    plan: free
    # Render exports NODE_ENV=production, under which `npm ci` skips devDependencies and leaves
    # Vite missing. The build needs them even though the running server does not.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    # Answers without touching the database, so a slow query cannot look like a dead instance.
    healthCheckPath: /api/health
    envVars:
      # Matches the Dockerfile, so both paths build on the same major version.
      - key: NODE_VERSION
        value: "22"
      # Render terminates TLS in front of the instance. Without this every request appears to come
      # from one address and the rate limiter would lock out everybody at once.
      - key: TRUST_PROXY
        value: "1"
      # Entered in the dashboard. `sync: false` is what keeps them out of the repository.
      - key: MONGODB_URI
        sync: false
      - key: CLIENT_ORIGIN
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false
