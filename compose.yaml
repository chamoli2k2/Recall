# Local development only. Production should use an authenticated MongoDB replica set.
services:
  mongo:
    image: mongo:7
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports: ["127.0.0.1:27017:27017"]
    volumes: ["mongo_data:/data/db"]
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'try { rs.status().ok } catch (e) { rs.initiate({_id:\"rs0\",members:[{_id:0,host:\"mongo:27017\"}]}); }' | tail -n 1 | grep 1"]
      interval: 5s
      timeout: 10s
      retries: 20
  app:
    build: .
    depends_on:
      mongo: { condition: service_healthy }
    ports: ["127.0.0.1:4000:4000"]
    environment:
      # HTTP is development-only; production must set NODE_ENV=production behind HTTPS.
      NODE_ENV: development
      PORT: 4000
      MONGODB_URI: mongodb://mongo:27017/recall?replicaSet=rs0
      CLIENT_ORIGIN: http://localhost:4000
volumes:
  mongo_data:
